---
- name: Deploy Spring PetClinic
  hosts: petclinic
  become: true

  tasks:

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - git
          - maven
        state: present
        update_cache: true

    - name: Create Tomcat group
      group:
        name: "{{ tomcat_group }}"
        state: present

    - name: Create Tomcat user
      user:
        name: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        shell: /bin/false
        create_home: false
        state: present

    - name: Download Tomcat
      get_url:
        url: "{{ tomcat_download_url }}"
        dest: /tmp/tomcat.tar.gz

    - name: Extract Tomcat
      unarchive:
        src: /tmp/tomcat.tar.gz
        dest: /opt
        remote_src: true
        creates: "/opt/apache-tomcat-{{ tomcat_version }}"

    - name: Create symbolic link
      file:
        src: "/opt/apache-tomcat-{{ tomcat_version }}"
        dest: "{{ tomcat_install_dir }}"
        state: link
    - name: Install Tomcat service
      template:
        src: templates/tomcat.service.j2
        dest: /etc/systemd/system/tomcat.service

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable Tomcat
      systemd:
        name: tomcat
        enabled: true

    - name: Start Tomcat
      systemd:
        name: tomcat
        state: started
    - name: Clone Spring PetClinic repository
      git:
        repo: "{{ petclinic_repo }}"
        dest: "{{ petclinic_source_dir }}"
        version: main
    - name: Build Spring PetClinic
      command:
        cmd: mvn clean package -DskipTests
        chdir: "{{ petclinic_source_dir }}"
    - name: Deploy application WAR
      copy:
        remote_src: true
        src: "{{ petclinic_source_dir }}/target/petclinic.war"
        dest: "{{ tomcat_install_dir }}/webapps/petclinic.war"

  handlers:

    - name: Restart Tomcat
      systemd:
        name: tomcat
        state: restarted
    - name: Wait for Tomcat
      wait_for:
        port: 8080
        timeout: 120
    - name: Perform application health check
      uri:
        url: http://localhost:8080/petclinic/
        method: GET
        status_code: 200
      register: health_check