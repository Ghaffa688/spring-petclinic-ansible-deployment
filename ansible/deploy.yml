---
- name: Deploy Spring PetClinic
  hosts: petclinic
  become: true

  tasks:

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - git
          - maven
        state: present
        update_cache: true
        - name: Create Tomcat group
      group:
        name: "{{ tomcat_group }}"
        state: present

    - name: Create Tomcat user
      user:
        name: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        shell: /bin/false
        create_home: false
        state: present

    - name: Download Tomcat
      get_url:
        url: "{{ tomcat_download_url }}"
        dest: /tmp/tomcat.tar.gz

    - name: Extract Tomcat
      unarchive:
        src: /tmp/tomcat.tar.gz
        dest: /opt
        remote_src: true
        creates: "/opt/apache-tomcat-{{ tomcat_version }}"

    - name: Create symbolic link
      file:
        src: "/opt/apache-tomcat-{{ tomcat_version }}"
        dest: "{{ tomcat_install_dir }}"
        state: link